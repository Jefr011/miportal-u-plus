<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | MiPortal U Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-page">
<header class="login-brand"><a class="portal-logo" href="index.html">MiPortal <span>U Plus+</span></a><div class="unab-logo"><img src="./assets/dashboard/logo_UNAB.png" alt="Logo UNAB" class="logo-img"><div><strong>unab</strong><small>Universidad Autónoma<br>de Bucaramanga</small></div></div><a class="text-link" href="index.html">¿Necesitas ayuda?</a></header>
